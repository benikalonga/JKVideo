name: Auto Close Invalid Issues

on:
  issues:
    types: [opened]

jobs:
  check-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          ABUSIVE_WORDS: ${{ secrets.ABUSIVE_WORDS }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const title = (context.payload.issue.title || '').toLowerCase();
            const body  = (context.payload.issue.body  || '').toLowerCase();
            const text  = title + ' ' + body;

            // --- Layer 1: abusive content (word list stored in the ABUSIVE_WORDS secret, comma-separated) ---
            const abusiveWords = (process.env.ABUSIVE_WORDS || '').split(',').map(w => w.trim()).filter(Boolean);
            const isAbusive = abusiveWords.some(w => w && text.includes(w.toLowerCase()));

            if (isAbusive) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: [
                  'Hello,',
                  '',
                  'This issue contains abusive content and has been closed automatically.',
                  '',
                  'We welcome constructive feedback, but please stay polite and respectful.',
                  'For bugs or feature requests, please resubmit using the official templates. Thank you.',
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner, repo, issue_number,
                state: 'closed',
                state_reason: 'not_planned',
              });
              await github.rest.issues.addLabels({
                owner, repo, issue_number,
                labels: ['invalid'],
              });
              return;
            }

            // --- Layer 2: template not used ---
            const templateMarkers = [
              '### Platform',
              '### Description',
              '### Steps to reproduce',
              '### Background',
              '### Proposed solution',
            ];
            const isFromTemplate = templateMarkers.some(m => body.includes(m.toLowerCase()));

            if (!isFromTemplate) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: [
                  'Thanks for your feedback!',
                  '',
                  'This issue did not follow a template and has been closed automatically.',
                  '',
                  'Please resubmit using one of the following:',
                  '- 🐛 **Bug report** → use the [bug report template](../../issues/new?template=bug_report.yml)',
                  '- 💡 **Feature request** → use the [feature request template](../../issues/new?template=feature_request.yml)',
                  '- 💬 **Questions** → ask in [Discussions](../../discussions)',
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner, repo, issue_number,
                state: 'closed',
                state_reason: 'not_planned',
              });
              await github.rest.issues.addLabels({
                owner, repo, issue_number,
                labels: ['invalid'],
              });
            }
