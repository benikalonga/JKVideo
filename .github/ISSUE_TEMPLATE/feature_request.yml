name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please search existing issues first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Background
      placeholder: What problem does this feature solve? What is the current pain point?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: How should the feature work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      placeholder: Have you considered other approaches?

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to submit a PR?
      options:
        - Yes, I would like to implement this
        - No, I would like a maintainer to implement it
        - Not sure
    validations:
      required: true
