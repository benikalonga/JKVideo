name: Bug report
description: Report a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much as you can to help us find the problem faster.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android (Dev Build)
        - Android (Expo Go)
        - iOS (Dev Build)
        - iOS (Expo Go)
        - Web
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Video playback
        - Live streams
        - Danmaku (bullet comments)
        - Sign-in / account
        - Downloads
        - UI
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe the problem you ran into...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?

  - type: textarea
    id: logs
    attributes:
      label: Error logs
      description: Paste any console errors here
      render: shell
